# 3 BLE profiles (n + 2 peripherals = 5 max conn)
CONFIG_BT_MAX_CONN=5
CONFIG_BT_MAX_PAIRED=5

# Dongle mode: 2 peripherals (left + right)
CONFIG_ZMK_SPLIT_BLE_CENTRAL_PERIPHERALS=2

# Display
CONFIG_ZMK_DISPLAY=y
CONFIG_BT_BAS=n
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y

# Stay awake (dongle is USB-powered)
CONFIG_ZMK_SLEEP=n
CONFIG_ZMK_IDLE_TIMEOUT=60000

# Boost BLE TX power for reliable peripheral comms
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y
CONFIG_ZMK_BLE_EXPERIMENTAL_FEATURES=y

# iPad compatibility
CONFIG_ZMK_HID_CONSUMER_REPORT_USAGES_BASIC=y

CONFIG_BT_DEVICE_NAME_MAX=64

# Pointing (matches base corne.conf)
CONFIG_ZMK_POINTING=y