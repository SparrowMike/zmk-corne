# Show macOS-style modifier keys on dongle display
CONFIG_ZMK_DONGLE_DISPLAY_MAC_MODIFIERS=y

# Split BLE link tuning (matches charybdis dongle)
CONFIG_ZMK_SPLIT_BLE_PREF_INT=6
CONFIG_ZMK_SPLIT_BLE_PREF_LATENCY=4
CONFIG_ZMK_SPLIT_BLE_PREF_TIMEOUT=400

# iPad compatibility
CONFIG_ZMK_HID_CONSUMER_REPORT_USAGES_BASIC=y

CONFIG_BT_DEVICE_NAME_MAX=64

# Pointing for trackball/mouse keymap behaviors
CONFIG_ZMK_POINTING=y
