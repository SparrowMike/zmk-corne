include:
  # Dongle (BLE central, OLED, Studio host)
  - board: nice_nano_v2
    shield: corne_dongle_nano dongle_display
    snippet: studio-rpc-usb-uart
    cmake-args: -DCONFIG_ZMK_STUDIO=y
    artifact-name: corne_dongle_nano

  # Halves as bare BLE peripherals (no display)
  - board: nice_nano_v2
    shield: corne_left
    cmake-args: -DCONFIG_ZMK_SPLIT_ROLE_CENTRAL=n
    artifact-name: corne_left_peripheral
  - board: nice_nano_v2
    shield: corne_right
    cmake-args: -DCONFIG_ZMK_SPLIT_ROLE_CENTRAL=n
    artifact-name: corne_right_peripheral

  # Standalone (non-dongle) builds, with nice!view + Studio on the left
  - board: nice_nano_v2
    shield: corne_left nice_view_adapter nice_view_gem
    snippet: studio-rpc-usb-uart
    cmake-args: -DCONFIG_ZMK_STUDIO=y
    artifact-name: corne_left_with_studio
  - board: nice_nano_v2
    shield: corne_right nice_view_adapter nice_view_gem
    cmake-args: -DCONFIG_NICE_VIEW_GEM_ANIMATION=n

  - board: nice_nano_v2
    shield: settings_reset
